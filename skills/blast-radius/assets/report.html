<!doctype html>
<!--
  blast-radius html report.

  the skill replaces the DATA line below and saves a copy. nothing else
  changes. open this file as is and you get the demo data.

  DATA shape:
  {
    target: "pr #123",              // what was reviewed
    range: "main...feat/x",         // base...head
    summary: "one or two sentences",
    linesToRead: 74,                // size of all "read" ranges
    linesTotal: 812,                // all changed lines
    oneWayDoors: 1,
    slopFlags: 3,
    linesByTier: [520, 218, 52, 22], // changed lines per tier 0..3
    units: [
      { tier: 0, title: "button color", where: "app/page.tsx:41-58" },
      { tier: 3, title: "upsert by domain", verdict: "blocks",   // ok | check | blocks
        fields: [["reach", "every inbound form"], ["reversibility", "no"]],
        read: ["lib/attio.ts:30-74"] }
    ],
    notChecked: ["no tests for the webhook"],
    foundationMap: ["src/lib/db.ts: drizzle client"]
  }
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>blast radius</title>
<style>
  :root {
    --bg: #fbfbfa; --fg: #1d1d1b; --muted: #6b6b66; --line: #e3e2de; --soft: #f1f0ec;
    --t0: #8d9097; --t1: #3f7fcf; --t2: #c98a1c; --t3: #cf4a45;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #141414; --fg: #ececea; --muted: #9a9a95; --line: #2d2d2b; --soft: #1f1f1e; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg);
         font: 14px/1.5 ui-sans-serif, system-ui, -apple-system, sans-serif; }
  main { max-width: 820px; margin: 0 auto; padding: 32px 20px 64px; display: flex; flex-direction: column; gap: 18px; }
  h1 { font-size: 18px; margin: 0; }
  code, .mono { font: 12px/1.4 ui-monospace, SFMono-Regular, Menlo, monospace; color: var(--muted); }
  .muted { color: var(--muted); font-size: 12px; }
  .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
  .stat { border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; }
  .stat b { display: block; font-size: 20px; }
  .stat span { font-size: 12px; color: var(--muted); }
  .bar { display: flex; height: 10px; border-radius: 5px; overflow: hidden; background: var(--soft); }
  .tier { border-left: 4px solid var(--c); padding: 2px 0 2px 14px; }
  .tier h2 { font-size: 14px; margin: 0 0 6px; display: flex; gap: 8px; align-items: baseline; }
  .tier h2 small { font-weight: 400; font-size: 12px; color: var(--muted); }
  .row { font-size: 13px; padding: 2px 0; }
  .row code { margin-left: 6px; }
  .card { border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px; margin-top: 8px; }
  .head { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; font-weight: 600; margin-bottom: 6px; }
  .verdict { font-size: 12px; font-weight: 500; white-space: nowrap; padding: 1px 8px; border-radius: 10px; border: 1px solid var(--c); color: var(--c); }
  .kv { display: grid; grid-template-columns: 130px 1fr; gap: 3px 12px; font-size: 13px; }
  .kv .k { color: var(--muted); }
  .read { margin-top: 8px; padding: 6px 8px; border-radius: 6px; background: var(--soft); font-size: 12px; }
  .empty { font-size: 13px; color: var(--muted); }
  ul { margin: 0; padding-left: 18px; font-size: 13px; }
  @media (max-width: 560px) { .stats { grid-template-columns: repeat(2, 1fr); } .kv { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<main id="app"></main>
<script>
const DATA = null; // @@DATA@@

// shown when the file is opened before the skill filled it in
const DEMO = {
  target: "demo", range: "main...feat/inbound-dedup",
  summary: "dedups inbound companies by domain. the attio upsert can merge unrelated companies and can't be undone.",
  linesToRead: 74, linesTotal: 812, oneWayDoors: 1, slopFlags: 3,
  linesByTier: [520, 218, 52, 22],
  units: [
    { tier: 0, title: "submit button color and padding", where: "app/inbound/page.tsx:41-58" },
    { tier: 0, title: "form header copy", where: "app/inbound/copy.ts:3-9" },
    { tier: 1, title: "field validation order, same rules", where: "app/inbound/form.tsx:70-112" },
    { tier: 2, title: "flow schema: source goes from optional to required", verdict: "check",
      fields: [["reach", "7 importers, incl. the inbound webhook and 2 cron jobs"],
               ["reversibility", "a revert fixes it"],
               ["safety", "old payloads without source now get a 400"],
               ["slop", "none"]],
      read: ["lib/flow/schema.ts:12-30", "app/api/inbound/route.ts:44-52"] },
    { tier: 3, title: "attio upsert matches on domain instead of record id", verdict: "blocks",
      fields: [["what and why", "dedup companies from the inbound form (per PR body)"],
               ["reach", "every inbound submission, external CRM"],
               ["reversibility", "no. overwritten attio fields don't come back on revert"],
               ["safety", "two companies on gmail.com merge into one record"],
               ["slop", "catch logs and returns 200, failed submissions vanish"],
               ["missing", "lib/attio/people.ts changed with this file in 6 of 7 recent commits"]],
      read: ["lib/attio/companies.ts:30-74", "app/api/inbound/route.ts:60-81"] }
  ],
  notChecked: ["no tests for the webhook, behavior with real payloads unverified"],
  foundationMap: ["src/lib/db.ts: drizzle client, all db access", "lib/attio/*: writes to the CRM"]
};

const d = DATA || DEMO;
const TIERS = [
  ["paint", "skim it. revert costs nothing"],
  ["furniture", "local logic, contract unchanged"],
  ["load-bearing walls", "contracts. read the diff"],
  ["foundation", "one-way doors. read every line"]
];
const VERDICT_COLOR = { ok: "var(--t1)", check: "var(--t2)", blocks: "var(--t3)" };

// tiny element helper. text always goes in as textContent, never as html.
function el(tag, attrs, ...kids) {
  const n = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (k === "style") n.style.cssText = v; else n.setAttribute(k, v);
  }
  for (const k of kids.flat(Infinity)) if (k != null) n.append(k instanceof Node ? k : String(k));
  return n;
}

const app = document.getElementById("app");
const pct = d.linesTotal ? Math.round(100 * d.linesToRead / d.linesTotal) : 0;

app.append(
  el("div", {}, el("h1", {}, "blast radius: " + d.target), el("div", { class: "mono" }, d.range)),
  el("div", {}, d.summary),
  el("div", { class: "stats" },
    el("div", { class: "stat" }, el("b", {}, `${d.linesToRead} / ${d.linesTotal}`), el("span", {}, `lines to read (${pct}%)`)),
    el("div", { class: "stat" }, el("b", {}, d.units.length), el("span", {}, "change units")),
    el("div", { class: "stat" }, el("b", {}, d.oneWayDoors), el("span", {}, "one-way doors")),
    el("div", { class: "stat" }, el("b", {}, d.slopFlags), el("span", {}, "slop flags"))),
  el("div", {},
    el("div", { class: "bar" }, d.linesByTier.map((n, i) =>
      el("div", { style: `flex:${n};background:var(--t${i})`, title: `${TIERS[i][0]}: ${n}` }))),
    el("div", { class: "muted", style: "margin-top:4px" },
      d.linesByTier.map((n, i) => `${TIERS[i][0]} ${n}`).join(" · ")))
);

// one block per tier, paint first, foundation last
TIERS.forEach(([name, hint], tier) => {
  const units = d.units.filter(u => u.tier === tier);
  const block = el("section", { class: "tier", style: `--c:var(--t${tier})` },
    el("h2", {}, `${tier} · ${name}`, el("small", {}, hint)));
  if (!units.length) block.append(el("div", { class: "empty" }, "nothing here"));
  for (const u of units) {
    if (tier < 2) {
      block.append(el("div", { class: "row" }, u.title, u.where ? el("code", {}, u.where) : null));
      continue;
    }
    block.append(el("div", { class: "card" },
      el("div", { class: "head" }, el("span", {}, u.title),
        u.verdict ? el("span", { class: "verdict", style: `--c:${VERDICT_COLOR[u.verdict] || "var(--muted)"}` }, u.verdict) : null),
      el("div", { class: "kv" }, (u.fields || []).map(([k, v]) => [el("div", { class: "k" }, k), el("div", {}, v)])),
      u.read && u.read.length ? el("div", { class: "read" }, "read: ", u.read.map((r, i) => [i ? ", " : "", el("code", {}, r)])) : null));
  }
  app.append(block);
});

app.append(
  el("section", { class: "tier", style: "--c:var(--line)" },
    el("h2", {}, "not checked", el("small", {}, "what this review doesn't know")),
    d.notChecked && d.notChecked.length ? el("ul", {}, d.notChecked.map(t => el("li", {}, t))) : el("div", { class: "empty" }, "nothing listed")),
  el("details", {}, el("summary", { class: "muted" }, "foundation map"),
    el("ul", {}, (d.foundationMap || []).map(t => el("li", {}, t))))
);
</script>
</body>
</html>
